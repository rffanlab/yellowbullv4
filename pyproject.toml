[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "yellowbull"
version = "0.1.0"
description = "老黄牛 — 通用型 AI 工作助手（Phase 1 MVP）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "litellm>=1.40",
  "textual>=0.50",
  "rich>=13",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "respx>=0.21",
]

[project.scripts]
lh = "yellowbull.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yellowbull"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not llm'"
markers = [
  "llm: 需要真实 LLM API（默认跳过；手动跑: pytest -m llm）",
]

[tool.coverage.run]
source = ["src/yellowbull"]
omit = ["*cli*", "*__main__*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
